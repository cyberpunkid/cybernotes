title: "CyberNotes"
tagline_id: "Catatan Threat Intel, Detection Engineering & AI Security"
tagline_en: "Threat Intel, Detection Engineering & AI Security notes"
description: >-
  Artikel dan catatan teknis seputar Threat Intelligence, EDR, Wazuh, ESET,
  Linux hardening, MITRE ATT&CK, dan AI Security — bagian dari ekosistem cyberpunkID.
author: "cyberpunkID"

# ---------------------------------------------------------------------------
# IMPORTANT — GitHub Pages URL
# Repo project pages are served at:  https://<user>.github.io/<repo-name>/
# Since this repo is named "cybernotes", the live URL will be:
#   https://cyberpunkid.github.io/cybernotes/
# If you want the path to read /cybersecurity-notes/ instead, either:
#   (a) rename this GitHub repository to "cybersecurity-notes", or
#   (b) keep the repo name "cybernotes" and just link to it as-is.
# Whichever you choose, update `baseurl` below to match the repo name exactly.
# ---------------------------------------------------------------------------
url: "https://cyberpunkid.github.io"
baseurl: "/cybernotes"

# SEO-friendly permalinks: /category/subcategory/YYYY/MM/DD/judul-artikel/
permalink: /:categories/:year/:month/:day/:title/

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-gist

paginate: 8
paginate_path: "/page/:num/"

collections:
  posts:
    output: true

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"

# List of categories shown in the nav / sidebar. Extend freely — new posts
# using a category not listed here still work, they just won't get a
# dedicated nav shortcut unless you add them here too.
nav_categories:
  - "Threat Intelligence"
  - "EDR"
  - "Wazuh"
  - "ESET"
  - "Linux"
  - "MITRE ATT&CK"
  - "AI Security"

social:
  github: "https://github.com/cyberpunkid"
  cv_site: "https://cyberpunkid.github.io"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules
